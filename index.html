<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jerry's Apartment - 3D</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#edebe6;font-family:Georgia,'Times New Roman',serif}
  #app{position:fixed;inset:0}
  .overlay{position:fixed;left:28px;top:24px;color:#3c362e;pointer-events:none;user-select:none;z-index:5}
  .overlay h1{margin:0;font-size:30px;letter-spacing:6px;font-weight:600}
  .overlay p{margin:6px 0 0;font-size:13px;letter-spacing:2.5px;color:#8a8174}
  .hint{position:fixed;left:28px;bottom:22px;font-size:12px;letter-spacing:1.5px;color:#9a9184;z-index:5;user-select:none;pointer-events:none}
  #kramer{position:fixed;right:26px;bottom:22px;z-index:6;border:1px solid #b4a78f;background:#f6f3ec;color:#4a4337;
    font-family:Georgia,serif;font-size:14px;letter-spacing:2px;padding:11px 22px;border-radius:999px;cursor:pointer;
    box-shadow:0 4px 14px rgba(60,50,30,.18);transition:transform .12s ease, background .2s}
  #kramer:hover{background:#fffdf7;transform:translateY(-1px)}
  #kramer:active{transform:scale(.96)}
  #err{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#7e2c22;color:#fff;font:12px monospace;
    padding:8px 14px;border-radius:6px;display:none;z-index:50;max-width:80vw}
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>
<div class="overlay"><h1>THE APARTMENT</h1><p>APT 5A &middot; 129 WEST 81st STREET &middot; NEW YORK</p></div>
<div class="hint">DRAG TO ORBIT &nbsp;&middot;&nbsp; SCROLL TO ZOOM</div>
<button id="kramer">KRAMER !</button>
<div id="err"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* never fail silently */
const errBox=document.getElementById('err');
window.addEventListener('error',e=>{errBox.style.display='block';errBox.textContent='Error: '+e.message;});

/* ---------- renderer / scene / camera ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.06;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.getElementById('app').appendChild(renderer.domElement);

const scene=new THREE.Scene();
const bgC=document.createElement('canvas');bgC.width=16;bgC.height=512;
{const g=bgC.getContext('2d'),gr=g.createLinearGradient(0,0,0,512);
 gr.addColorStop(0,'#ffffff');gr.addColorStop(.55,'#f3f1ec');gr.addColorStop(1,'#dcd8d0');
 g.fillStyle=gr;g.fillRect(0,0,16,512);}
const bgT=new THREE.CanvasTexture(bgC);bgT.colorSpace=THREE.SRGBColorSpace;
scene.background=bgT;

const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,200);
camera.position.set(15,13,20);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0.1,0.5,-0.4);
controls.enableDamping=true;controls.dampingFactor=.06;
controls.autoRotate=true;controls.autoRotateSpeed=-.45;
controls.minDistance=5;controls.maxDistance=34;
controls.minPolarAngle=.18;controls.maxPolarAngle=1.42;

window.__cam=camera;window.__controls=controls;
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),.04).texture;

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(0xfff6e8,0xb9b3a8,.42));
const sun=new THREE.DirectionalLight(0xfff2dd,1.9);
sun.position.set(-9,14,-7);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
const sc=sun.shadow.camera;sc.left=-13;sc.right=13;sc.top=13;sc.bottom=-13;sc.near=1;sc.far=45;
sun.shadow.bias=-.0006;sun.shadow.normalBias=.02;sun.shadow.radius=4;
scene.add(sun);
const fill=new THREE.DirectionalLight(0xeaf0ff,.42);
fill.position.set(9,7,11);scene.add(fill);

/* ---------- materials ---------- */
const matCache={};
const mat=(c,r=.85,m=0)=>{const k=c+'_'+r+'_'+m;return matCache[k]??(matCache[k]=new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m}));};
const MAT={
  base:mat(0x8b8177,.9), wains:mat(0xa49b90,.88), rail:mat(0xcdc6ba,.85), upper:mat(0xf4f2ec,.92),
  plain:mat(0xe6e2da,.92), skin:mat(0xf7f6f2,.9), cap:mat(0xfbfbf8,.9),
  woodDark:mat(0x5a432f,.7), woodMid:mat(0x8a653f,.7), black:mat(0x232325,.6),
  couch:mat(0x7d99b8,.95), couchD:mat(0x7090ab,.95),
  white:mat(0xf3f2ee,.6), cream:mat(0xefe9da,.8)
};
MAT.brass=mat(0xb08c44,.35,.8);
MAT.steel=mat(0xb9bcc0,.4,.7);
MAT.navy=mat(0x46506b,.85);
MAT.royal=mat(0x3b59a3,.8);
MAT.green=mat(0x4fc24a,.5,.15);
MAT.glass=new THREE.MeshStandardMaterial({color:0xcfe4ef,roughness:.1,metalness:0,transparent:true,opacity:.32});

/* ---------- small geometry helpers ---------- */
const M=(geo,material)=>{const o=new THREE.Mesh(geo,material);o.castShadow=true;o.receiveShadow=true;return o;};
const box=(p,w,h,d,m,x,y,z,ry=0)=>{const o=M(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.rotation.y=ry;p.add(o);return o;};
const rbox=(p,w,h,d,r,m,x,y,z,ry=0)=>{const o=M(new RoundedBoxGeometry(w,h,d,3,r),m);o.position.set(x,y,z);o.rotation.y=ry;p.add(o);return o;};
const cyl=(p,rt,rb,h,m,x,y,z,seg=20)=>{const o=M(new THREE.CylinderGeometry(rt,rb,h,seg),m);o.position.set(x,y,z);p.add(o);return o;};
const tube=(p,a,b,r,m)=>{const v=new THREE.Vector3().subVectors(b,a);const o=M(new THREE.CylinderGeometry(r,r,v.length(),10),m);
  o.position.copy(a).add(b).multiplyScalar(.5);
  o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),v.clone().normalize());p.add(o);return o;};

const canvasTex=(w,h,draw,rx=1,ry=1)=>{const c=document.createElement('canvas');c.width=w;c.height=h;
  draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=4;return t;};

/* wood plank texture */
const woodTex=(()=>{return canvasTex(512,256,(g,w,h)=>{
  g.fillStyle='#c9a36e';g.fillRect(0,0,w,h);
  const rows=8,ph=h/rows;
  for(let r=0;r<rows;r++){
    const tone=18-((r*53)%36);
    g.fillStyle=`rgb(${201+tone-10},${163+tone-12},${110+tone-14})`;
    g.fillRect(0,r*ph,w,ph-1.4);
    g.strokeStyle='rgba(120,85,45,.35)';g.lineWidth=1;
    for(let i=0;i<5;i++){const y=r*ph+(i*7.3+r*5)%ph;g.beginPath();g.moveTo(0,y);
      g.bezierCurveTo(w*.3,y+2,w*.6,y-2,w,y+1);g.stroke();}
    g.fillStyle='rgba(100,70,40,.5)';
    const sx=((r*197)%w);g.fillRect(sx,r*ph,2,ph);
    g.fillStyle='rgba(90,60,35,.28)';g.fillRect(0,r*ph+ph-1.6,w,1.6);
  }
});})();
woodTex.repeat.set(1/2.6,1/1.3);
const woodFloorMat=new THREE.MeshStandardMaterial({map:woodTex,roughness:.7,color:0xffffff});

/* tile texture factory */
const tileMat=(base,grout)=>{const t=canvasTex(128,128,(g)=>{
  g.fillStyle=base;g.fillRect(0,0,128,128);g.strokeStyle=grout;g.lineWidth=3;
  for(let i=0;i<=4;i++){g.beginPath();g.moveTo(i*32,0);g.lineTo(i*32,128);g.stroke();
    g.beginPath();g.moveTo(0,i*32);g.lineTo(128,i*32);g.stroke();}
});t.repeat.set(1/1.3,1/1.3);return new THREE.MeshStandardMaterial({map:t,roughness:.8});};

/* rug texture */
const rugTex=canvasTex(256,180,(g,w,h)=>{
  g.fillStyle='#2d3645';g.fillRect(0,0,w,h);
  g.fillStyle='#cfd3cd';
  for(let i=0;i<6;i++){const y=18+i*26;g.fillRect(10,y,w-20,3);g.fillRect(10,y+7,w-20,1.6);}
  g.strokeStyle='#cfd3cd';g.lineWidth=2;g.strokeRect(6,6,w-12,h-12);
});
rugTex.repeat.set(1,1);
const rugMat=new THREE.MeshStandardMaterial({map:rugTex,roughness:.95});

/* glow sprite */
const glowTex=canvasTex(128,128,(g)=>{const gr=g.createRadialGradient(64,64,2,64,64,62);
  gr.addColorStop(0,'rgba(255,255,255,.9)');gr.addColorStop(.4,'rgba(255,255,255,.28)');gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,128,128);});
const makeGlow=(color,s,op=.5)=>{const m=new THREE.SpriteMaterial({map:glowTex,color,transparent:true,opacity:op,
  blending:THREE.AdditiveBlending,depthWrite:false});const sp=new THREE.Sprite(m);sp.scale.set(s,s,1);return sp;};

/* simple framed art */
const artTex=(kind)=>canvasTex(160,200,(g,w,h)=>{
  if(kind==='cars'){g.fillStyle='#e8e2d2';g.fillRect(0,0,w,h);
    const cols=['#b03a2a','#2a4d8f','#3a7a3f'];
    cols.forEach((c,i)=>{const y=30+i*55;g.fillStyle=c;g.fillRect(25,y,w-50,26);
      g.fillStyle='#222';g.beginPath();g.arc(48,y+28,8,0,7);g.arc(w-48,y+28,8,0,7);g.fill();});
  }else if(kind==='poster'){g.fillStyle='#1d2435';g.fillRect(0,0,w,h);
    g.fillStyle='#c8452e';g.beginPath();g.moveTo(0,h);g.lineTo(w,40);g.lineTo(w,h);g.fill();
    g.fillStyle='#e8e2d2';g.fillRect(18,18,w-36,8);g.fillRect(18,34,w-70,5);
  }else if(kind==='photo'){g.fillStyle='#d9cdb6';g.fillRect(0,0,w,h);
    g.fillStyle='#8a7a5d';g.fillRect(18,30,w-36,h-80);g.fillStyle='#bfae8d';g.fillRect(30,46,w-60,40);
  }else{g.fillStyle='#dfd8c6';g.fillRect(0,0,w,h);
    g.fillStyle='#9aa98f';g.fillRect(12,h*.55,w-24,h*.3);g.fillStyle='#b9c8d6';g.fillRect(12,16,w-24,h*.4);
    g.fillStyle='#7d6b4f';g.fillRect(12,h*.62,w-24,6);}
});
const makeArt=(w,h,kind,frame=MAT.black)=>{
  const g=new THREE.Group();
  box(g,w+.05,h+.05,.035,frame,0,0,0);
  const pic=new THREE.Mesh(new THREE.PlaneGeometry(w,h),
    new THREE.MeshStandardMaterial({map:artTex(kind),roughness:.9}));
  pic.position.z=.02;g.add(pic);return g;};

/* ---------- walls ---------- */
const WALL_H=2.62;
const layersFor=(style,H,th)=>style==='main'
  ?[[0,.13,MAT.base,th],[.13,.97,MAT.wains,th],[.97,1.03,MAT.rail,th+.035],
    [1.03,2.08,MAT.upper,th],[2.08,2.13,MAT.rail,th+.03],[2.13,H,MAT.upper,th]]
  :style==='white'?[[0,H,MAT.skin,th]]:[[0,H,MAT.plain,th]];

function buildWall(o){
  const [x1,z1]=o.a,[x2,z2]=o.b,dx=x2-x1,dz=z2-z1,len=Math.hypot(dx,dz);
  const th=o.t??.16,H=o.h??WALL_H;
  const g=new THREE.Group();g.position.set(x1,0,z1);g.rotation.y=Math.atan2(-dz,dx);
  const lay=layersFor(o.style||'main',H,th);
  const ops=(o.openings||[]).slice().sort((p,q)=>p.from-q.from);
  const spans=[];let cur=0;
  for(const op of ops){
    if(op.from>cur+.005)spans.push([cur,op.from,0,H]);
    if(op.y1<H-.005)spans.push([op.from,op.to,op.y1,H]);
    if((op.y0??0)>.005)spans.push([op.from,op.to,0,op.y0]);
    cur=op.to;}
  if(cur<len-.005)spans.push([cur,len,0,H]);
  for(const[s0,s1,y0,y1]of spans){const L=s1-s0;if(L<=.01)continue;
    for(const[a0,a1,m,tt]of lay){const yy0=Math.max(y0,a0),yy1=Math.min(y1,a1);
      if(yy1-yy0<.006)continue;
      const b=M(new THREE.BoxGeometry(L,yy1-yy0,tt),m);
      b.position.set(s0+L/2,(yy0+yy1)/2,0);g.add(b);}
    if(o.skin){const s=M(new THREE.BoxGeometry(L,y1-y0,.05),MAT.skin);
      s.position.set(s0+L/2,(y0+y1)/2,-(th/2+.025));g.add(s);}}
  if(o.cap!==false){const c=M(new THREE.BoxGeometry(len+th,.06,th+(o.skin?.1:.05)),MAT.cap);
    c.position.set(len/2,H+.03,o.skin?-.025:0);g.add(c);}
  scene.add(g);return g;}

/* wall-space placement helper */
const WP=(a,b)=>{const dx=b[0]-a[0],dz=b[1]-a[1],L=Math.hypot(dx,dz),ux=dx/L,uz=dz/L,nx=-uz,nz=ux;
  return{L,rotY:Math.atan2(-dz,dx),n:[nx,nz],
    at:(t,off=0,y=0)=>new THREE.Vector3(a[0]+ux*t+nx*off,y,a[1]+uz*t+nz*off)};};
const put=(obj,v,ry)=>{obj.position.copy(v);if(ry!=null)obj.rotation.y=ry;scene.add(obj);return obj;};

/* ---------- ground + rounded studio-stage base ---------- */
{const gnd=new THREE.Mesh(new THREE.PlaneGeometry(90,90),mat(0xefede8,.95));
 gnd.rotation.x=-Math.PI/2;gnd.position.y=-.385;gnd.receiveShadow=true;scene.add(gnd);}

const stageShape=(()=>{const x0=-7.3,x1=7.3,y0=-3.6,y1=5.75,r=2.1,s=new THREE.Shape();
  s.moveTo(x0+r,y0);s.lineTo(x1-r,y0);s.quadraticCurveTo(x1,y0,x1,y0+r);
  s.lineTo(x1,y1-r);s.quadraticCurveTo(x1,y1,x1-r,y1);
  s.lineTo(x0+r,y1);s.quadraticCurveTo(x0,y1,x0,y1-r);
  s.lineTo(x0,y0+r);s.quadraticCurveTo(x0,y0,x0+r,y0);return s;})();
{const g=new THREE.ExtrudeGeometry(stageShape,{depth:.34,bevelEnabled:false});
 g.rotateX(-Math.PI/2);const o=M(g,mat(0x3b3a3c,.85));o.position.y=-.34;scene.add(o);}
{const g=new THREE.ShapeGeometry(stageShape);g.rotateX(-Math.PI/2);
 const o=new THREE.Mesh(g,woodFloorMat);o.position.y=.012;o.receiveShadow=true;scene.add(o);}

/* ---------- stage-set wall fan (open toward camera) ---------- */
const pA=[-6.7,1.8],pB=[-6.2,-.6],pC=[-4.4,-2.4],pD=[-2.4,-3.3],pE=[-.85,-3.55],
      pF=[.55,-3.55],pG=[2.35,-3.4],pH=[4.9,-2.0],pI=[6.5,.3];
const wWest=[pA,pB],wWin=[pB,pC],wDesk=[pC,pD],wNA=[pD,pE],wHead=[pE,pF],
      wDoor=[pF,pG],wKit=[pG,pH],wEast=[pH,pI];
const PWest=WP(...wWest),PWin=WP(...wWin),PDesk=WP(...wDesk),PNA=WP(...wNA),
      PHead=WP(...wHead),PDoor=WP(...wDoor),PKit=WP(...wKit),PEast=WP(...wEast);

const WIN_T0=.3,WIN_T1=2.25,WIN_Y0=.95,WIN_Y1=2.42;
buildWall({a:pA,b:pB,t:.16,skin:true});
buildWall({a:pB,b:pC,t:.16,skin:true,openings:[{from:WIN_T0,to:WIN_T1,y0:WIN_Y0,y1:WIN_Y1}]});
buildWall({a:pC,b:pD,t:.16,skin:true});
buildWall({a:pD,b:pE,t:.16,skin:true});
buildWall({a:pE,b:pF,t:.16,openings:[{from:0,to:PHead.L,y1:2.05}]});  /* cased opening */
const DOOR_T0=.5,DOOR_T1=1.5;
buildWall({a:pF,b:pG,t:.16,skin:true,openings:[{from:DOOR_T0,to:DOOR_T1,y1:2.12}]});
buildWall({a:pG,b:pH,t:.16,skin:true});
buildWall({a:pH,b:pI,t:.16,skin:true});

/* hallway to the bathroom behind the cased opening */
buildWall({a:[-.85,-3.55],b:[-.85,-5.3],t:.14});
buildWall({a:[.55,-5.3],b:[.55,-3.55],t:.14});
buildWall({a:[-.85,-5.3],b:[.55,-5.3],t:.14});
{/* chunky casing with corner rosettes, like the set molding */
 for(const tt of[.07,PHead.L-.07]){const p=PHead.at(tt,.1,1.0);
   box(scene,.15,2.0,.22,MAT.rail,p.x,p.y,p.z,PHead.rotY);
   const rp=PHead.at(tt,.11,2.16);
   box(scene,.19,.19,.24,MAT.rail,rp.x,rp.y,rp.z,PHead.rotY);}
 const hp=PHead.at(PHead.L/2,.1,2.13);
 box(scene,PHead.L-.42,.15,.2,MAT.rail,hp.x,hp.y,hp.z,PHead.rotY);
 /* hallway door at the far end + warm light spilling out */
 box(scene,.72,1.96,.05,mat(0x9a9189,.8),-.15,1.0,-5.21,0);
 box(scene,.5,.6,.015,mat(0x8f877f,.85),-.15,1.48,-5.18,0);
 box(scene,.5,.6,.015,mat(0x8f877f,.85),-.15,.6,-5.18,0);
 cyl(scene,.025,.025,.04,MAT.brass,.12,1.0,-5.18).rotation.x=Math.PI/2;
 const hl=new THREE.PointLight(0xffdfae,3,3.5,2);hl.position.set(-.15,1.9,-4.5);scene.add(hl);}

/* ---------- window assembly ---------- */
{const g=new THREE.Group();const mid=(WIN_T0+WIN_T1)/2,w=WIN_T1-WIN_T0,h=WIN_Y1-WIN_Y0;
 const v=PWin.at(mid,0,(WIN_Y0+WIN_Y1)/2);g.position.copy(v);g.rotation.y=PWin.rotY;
 const fr=MAT.white;
 box(g,w+.16,.09,.2,fr,0,h/2+.02,0);box(g,w+.16,.12,.22,fr,0,-h/2-.04,0);
 box(g,.09,h+.1,.2,fr,-w/2-.03,0,0);box(g,.09,h+.1,.2,fr,w/2+.03,0,0);
 box(g,.07,h,.14,fr,0,0,0);
 box(g,w,.06,.12,fr,0,.02,0);
 for(const sx of[-1,1])for(const k of[-1,1])
   box(g,.03,h,.08,fr,sx*w/4*2/2+k*w/12,0,0);
 const gl=new THREE.Mesh(new THREE.PlaneGeometry(w,h),MAT.glass);gl.position.z=-.02;g.add(gl);
 /* blinds */
 for(let i=0;i<13;i++)box(g,w-.1,.016,.05,MAT.cream,0,h/2-.1-i*.062,.09);
 box(g,w-.08,.05,.06,MAT.cream,0,h/2-.04,.09);
 cyl(g,.006,.006,.5,MAT.cream,w/2-.18,h/2-.32,.12);
 /* daylight plane outside */
 const sun2=new THREE.Mesh(new THREE.PlaneGeometry(w+.7,h+.7),
   new THREE.MeshBasicMaterial({color:0xfff8e2}));
 sun2.position.z=-.4;sun2.rotation.y=Math.PI;g.add(sun2);
 const glow=makeGlow(0xfff3d0,2.6,.5);glow.position.set(0,0,-.3);g.add(glow);
 scene.add(g);}

/* ---------- front door ---------- */
let doorPivot;
{const trim=MAT.rail;
 const jamb=(t)=>{const p=PDoor.at(t,0,1.06);const o=box(scene,.09,2.12,.26,trim,p.x,p.y,p.z,PDoor.rotY);return o;};
 jamb(DOOR_T0-.03);jamb(DOOR_T1+.03);
 const hp=PDoor.at((DOOR_T0+DOOR_T1)/2,0,2.12+.045);
 box(scene,DOOR_T1-DOOR_T0+.22,.09,.26,trim,hp.x,hp.y,hp.z,PDoor.rotY);
 doorPivot=new THREE.Group();
 const hv=PDoor.at(DOOR_T1,0,0);doorPivot.position.copy(hv);doorPivot.rotation.y=PDoor.rotY;
 const leaf=new THREE.Group();doorPivot.add(leaf);
 const dw=DOOR_T1-DOOR_T0-.04;
 box(leaf,dw,2.08,.055,mat(0x9a9189,.8),-dw/2-.02,1.04,0);
 box(leaf,dw-.3,.78,.02,mat(0x8f877f,.85),-dw/2-.02,1.62,.038);
 box(leaf,dw-.3,.78,.02,mat(0x8f877f,.85),-dw/2-.02,.62,.038);
 const knob=cyl(leaf,.035,.035,.07,MAT.brass,-dw+.12,1.02,.04);knob.rotation.x=Math.PI/2;
 const db1=cyl(leaf,.025,.025,.05,MAT.brass,-dw+.12,1.22,.04);db1.rotation.x=Math.PI/2;
 const db2=cyl(leaf,.025,.025,.05,MAT.brass,-dw+.12,1.38,.04);db2.rotation.x=Math.PI/2;
 cyl(leaf,.012,.012,.02,MAT.brass,-dw/2-.02,1.62,.045).rotation.x=Math.PI/2;
 scene.add(doorPivot);
 /* intercom right of door */

let dust,dustBase,dustPh;
{const N=130;dustBase=new Float32Array(N*3);dustPh=new Float32Array(N*2);
 for(let i=0;i<N;i++){dustBase[i*3]=-5.4+rnd()*11.2;dustBase[i*3+1]=.2+rnd()*2.2;dustBase[i*3+2]=-3.1+rnd()*6.2;
   dustPh[i*2]=rnd()*Math.PI*2;dustPh[i*2+1]=.4+rnd()*.8;}
 const geo=new THREE.BufferGeometry();

/* ---------- coffee steam ---------- */
const steam=[];
if(window._steamAnchor){for(let i=0;i<3;i++){const s=makeGlow(0xffffff,.16,.35);
  s.position.copy(window._steamAnchor);scene.add(s);steam.push(s);}}

/* ---------- door burst (Kramer) ---------- */
const DOOR={state:'idle',t:0,base:doorPivot.rotation.y,shake:0};
const easeOutBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const easeInOut=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
function burst(){if(DOOR.state==='idle'){DOOR.state='open';DOOR.t=0;DOOR.shake=.05;}}
document.getElementById('kramer').addEventListener('click',burst);
(function autoKramer(){setTimeout(()=>{burst();autoKramer();},16000+Math.random()*9000);})();

/* ---------- animate ---------- */
const clock=new THREE.Clock();
let introT=0;
const camFrom=new THREE.Vector3(15,13,20),camTo=new THREE.Vector3(6.6,5.8,9.4);
camera.position.copy(camFrom);
window.__skipIntro=()=>{introT=1;camera.position.copy(camTo);};

function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;

  if(introT<1){introT=Math.min(1,introT+dt/2.4);
    const e=easeInOut(introT);
    camera.position.lerpVectors(camFrom,camTo,e);}

  /* door state machine */
  if(DOOR.state==='open'){DOOR.t+=dt/.26;
    const k=Math.min(DOOR.t,1);
    doorPivot.rotation.y=DOOR.base+easeOutBack(k)*1.8;
    if(DOOR.t>=1){DOOR.state='hold';DOOR.t=0;}}
  else if(DOOR.state==='hold'){DOOR.t+=dt/1.15;
    doorPivot.rotation.y=DOOR.base+1.8+Math.sin(t*14)*.012;
    if(DOOR.t>=1){DOOR.state='close';DOOR.t=0;}}
  else if(DOOR.state==='close'){DOOR.t+=dt/.9;
    const k=Math.min(DOOR.t,1);
    doorPivot.rotation.y=DOOR.base+(1-easeInOut(k))*1.8;
    if(DOOR.t>=1){DOOR.state='idle';doorPivot.rotation.y=DOOR.base;}}
  if(DOOR.shake>.001){scene.position.x=(Math.random()-.5)*DOOR.shake;
    scene.position.y=(Math.random()-.5)*DOOR.shake*.6;DOOR.shake*=.86;}
  else scene.position.set(0,0,0);

  /* tv flicker */
  if(tvScreen){const n=.6+.25*Math.sin(t*9.7)+.18*Math.sin(t*23.3)+.1*(Math.random()-.5);
    tvScreen.material.emissiveIntensity=Math.max(.25,n);
    tvLight.intensity=2.2+2.4*Math.max(0,n);}

  /* dust drift */
  {const p=dust.geometry.attributes.position.array;
   for(let i=0;i<130;i++){const ph=dustPh[i*2],sp=dustPh[i*2+1];
     p[i*3]=dustBase[i*3]+Math.sin(t*.3*sp+ph)*.25;
     p[i*3+1]=dustBase[i*3+1]+Math.sin(t*.22*sp+ph*2)*.18;
     p[i*3+2]=dustBase[i*3+2]+Math.cos(t*.26*sp+ph)*.25;}
   dust.geometry.attributes.position.needsUpdate=true;}

  /* coffee steam */
  steam.forEach((s,i)=>{const k=(t*.45+i/3)%1;
    s.position.y=window._steamAnchor.y+k*.5;
    s.position.x=window._steamAnchor.x+Math.sin(t*2+i*2)*.02;
    s.material.opacity=.32*Math.sin(Math.PI*k);
    s.scale.setScalar(.1+k*.22);});

  controls.update();
  renderer.render(scene,camera);
}
tick();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);});
